[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "afp"
version = "0.0.1"
description = "DTU 02807 project: neural audio fingerprinting with LSH retrieval and k-means/DBSCAN clustering"
authors = [
  { name = "Nikos Iliakis" },
]

keywords = ["audio fingerprinting", "locality-sensitive hashing", "k-means", "DBSCAN"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "nbconvert>=7",
    "nbformat>=5.10",
    "numba>=0.60",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.18.1",
    "threadpoolctl>=3.5",
]

[project.optional-dependencies]
pipeline = [
    "easydict>=1.14 ; sys_platform != 'darwin'",
    "einops>=0.8.2 ; sys_platform != 'darwin'",
    "librosa>=1.0.1 ; sys_platform != 'darwin'",
    "muq>=0.1.0 ; sys_platform != 'darwin'",
    "nnaudio>=0.3.4 ; sys_platform != 'darwin'",
    "soundfile>=0.12 ; sys_platform != 'darwin'",
    "torch==2.6.0 ; sys_platform != 'darwin'",
    "torchaudio==2.6.0 ; sys_platform != 'darwin'",
    "torchvision==0.21.0 ; sys_platform != 'darwin'",
    "tqdm>=4.66 ; sys_platform != 'darwin'",
    "transformers>=4.46,<5 ; sys_platform != 'darwin'",
    "x-clip>=0.15.0 ; sys_platform != 'darwin'",
]
gpu = [
    "cupy-cuda12x[ctk]>=14.2,<15 ; sys_platform != 'darwin'",
]
cuda = [
    "afp[pipeline,gpu]",
]

[dependency-groups]
dev = [
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "scikit-learn>=1.9.1",
]


[tool.uv.sources]
torch = { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402", "E401"]
"explorer/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
